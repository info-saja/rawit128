        }
        50% {

      @keyframes rvLineExpand {

      }

      @keyframes rvSubtitleReveal {

        }
      }

      }

        }
      }

      @keyframes rvOpeningHide {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (min-height: 780px) {

      @media (max-width: 350px) {

      @media (prefers-reduced-motion: reduce) {

          animation: none;
        }

        .rv-opening {

        }

        .rv-access-btn {
          transition: none;
        }
      }
    </style>
